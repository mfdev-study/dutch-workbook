name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-3.12-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Check ruff formatting
        run: uv run ruff format --check .

      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: nederlandse_workbook.settings
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: nederlandse_workbook.settings
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: uv run python manage.py test --verbosity=2

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push code to VPS (git push over SSH)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          git remote add vps "ssh://$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT/opt/dutchworkbook"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            git push vps main:main
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_PORT: ${{ secrets.HETZNER_PORT || 22 }}

      - name: Restore ownership, sync deps, migrate, compile messages, collect static, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            APP_DIR="/opt/dutchworkbook"
            APP_USER="dutchapp"
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR does not exist. Run VPS setup first."
              exit 1
            fi

            cd "$APP_DIR" || exit 1
            git config --global --add safe.directory "$APP_DIR"

            # Run the app workload directly as the SSH user (root in practice).
            # We deliberately avoid `sudo -u dutchapp`: manage.py loads the app's
            # .env itself (see production_settings._load_env_file), and anything we
            # create is re-chowned to $APP_USER at the end. Running as the SSH user
            # is far more robust than shelling out to sudo from a CI session.

            echo "Syncing dependencies..."
            uv sync

            echo "Running migrations..."
            uv run python manage.py migrate --settings nederlandse_workbook.production_settings

            echo "Compiling translation messages..."
            uv run python manage.py compilemessages --settings nederlandse_workbook.production_settings || \
              echo "WARNING: compilemessages failed; translations may be stale"

            echo "Collecting static files..."
            uv run python manage.py collectstatic --noinput --settings nederlandse_workbook.production_settings

            # Hand ownership of anything created just now back to the app user so
            # the gunicorn service (User=dutchapp) can still write to the tree.
            if [ "$(id -un)" != "$APP_USER" ]; then
              echo "Restoring ownership to $APP_USER..."
              chown -R "$APP_USER:$APP_USER" "$APP_DIR" .git
            fi

            if [ -f /etc/systemd/system/dutchworkbook.service ]; then
              echo "Restarting application..."
              systemctl restart dutchworkbook
              systemctl status dutchworkbook --no-pager
            else
              echo "WARNING: dutchworkbook.service not found. Run VPS setup first."
            fi

            echo "Deployment completed successfully!"
