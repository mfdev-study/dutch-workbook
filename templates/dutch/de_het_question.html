<div class="flex justify-between items-center mb-6">
    <span class="text-gray-500">Question {{ question_num }} / {{ total }}</span>
    <span class="text-gray-500">Score: {{ score }}</span>
</div>

<div class="w-full bg-gray-200 rounded-full h-2 mb-8">
    <div class="bg-dutch-orange h-2 rounded-full" style="width: {% widthratio question_num|add:"-1" total 100 %}%"></div>
</div>

<p class="text-center text-3xl font-bold text-gray-900 mb-4">___ {{ question.word }}</p>
{% if question.translation %}
<p class="text-center text-gray-600 mb-8">{{ question.translation }}</p>
{% endif %}

<div class="grid grid-cols-2 gap-4">
    <button
        hx-post="{% url 'dutch:answer' %}"
        hx-target="#quiz-content"
        hx-swap="innerHTML"
        hx-vals='{"question_id": {{ question.id }}}'
        name="answer"
        value="de"
        class="py-4 text-xl font-semibold rounded-lg border-2 border-gray-300 text-gray-700 hover:border-dutch-orange hover:bg-orange-50 transition"
    >de</button>
    <button
        hx-post="{% url 'dutch:answer' %}"
        hx-target="#quiz-content"
        hx-swap="innerHTML"
        hx-vals='{"question_id": {{ question.id }}}'
        name="answer"
        value="het"
        class="py-4 text-xl font-semibold rounded-lg border-2 border-gray-300 text-gray-700 hover:border-dutch-orange hover:bg-orange-50 transition"
    >het</button>
</div>
