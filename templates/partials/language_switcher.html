{% load i18n %}
<div class="relative ml-4" x-data="{ open: false }">
    <button @click="open = !open" class="flex items-center text-sm text-gray-600 hover:text-gray-900 focus:outline-none">
        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
        </svg>
        {% get_current_language as LANGUAGE_CODE %}
        {% if LANGUAGE_CODE == 'en' %}EN
        {% elif LANGUAGE_CODE == 'nl' %}NL
        {% elif LANGUAGE_CODE == 'ru' %}RU
        {% elif LANGUAGE_CODE == 'uk' %}UK
        {% endif %}
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>

    <div x-show="open" @click.away="open = false" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
        {% get_available_languages as LANGUAGES %}
        {% for lang_code, lang_name in LANGUAGES %}
            <form action="{% url 'set_language' %}" method="post" class="inline w-full">
                {% csrf_token %}
                <input type="hidden" name="language" value="{{ lang_code }}">
                <input type="hidden" name="next" value="{{ request.path }}">
                <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 {% if lang_code == LANGUAGE_CODE %}font-bold bg-gray-50{% endif %}">
                    {{ lang_name }}
                </button>
            </form>
        {% endfor %}
    </div>
</div>
